<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원 가입</title>
    <!-- fontawesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- bootstrap - css -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- 나의 css 파일 -->

    <!-- bootstrap - javascript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 나의 js 파일 -->
  </head>
  <body>
    <div class="container">
      <h1><i class="fa-solid fa-user-plus"></i> 회원 가입</h1>
      <br />
      <form>
        <div class="mb-3 mt-3">
          <label for="userId" class="mb-2"
            ><i class="fa-solid fa-user"></i> 사용자 ID:</label
          >
          <input type="text" class="form-control" id="userId" />
        </div>
        <div class="mb-3 mt-3">
          <label for="password" class="mb-2"
            ><i class="fa-solid fa-lock"></i> 비밀번호:</label
          >
          <input type="password" class="form-control" id="password" />
        </div>
        <div class="mb-3 mt-3">
          <label for="passwordCheck" class="mb-2"
            ><i class="fa-solid fa-lock"></i> 비밀번호 확인:</label
          >
          <input type="password" class="form-control" id="passwordCheck" />
        </div>
        <div class="mb-3 mt-3">
          <label for="email" class="mb-2"
            ><i class="fa-regular fa-envelope"></i> email:</label
          >
          <input type="email" class="form-control" id="email" />
        </div>
        <div>
          <label for="avatar"
            ><i class="fa-solid fa-user-astronaut"></i> 아바타 이미지</label
          >
          <input type="file" class="form-control" id="avatar" />
        </div>
        <div class="d-flex justify-content-center mb-3 mt-3">
          <button class="btn btn-primary">
            <i class="fa-solid fa-user-plus"></i> 회원가입
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
