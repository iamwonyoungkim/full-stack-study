<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>06-11</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }
      .title {
        text-align: center;
        font-weight: bold;
        font-size: 20pt;
      }
      .todo-done {
        text-decoration: line-through;
      }
      .container {
        padding: 10px;
      }
      .panel-borderless {
        border: 0;
        box-shadow: none;
      }
      .pointer {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app" class="container">
      <div class="card card-body bg-light">
        <div classe="title">:: Todolist App</div>
      </div>
      <div class="card card-default card-borderless">
        <div class="card-body">
          <div class="row mb-3">
            <div class="col">
              <!-- 새 할 일 추가 -->
              <div class="input-group">
                <input
                  id="msg"
                  type="text"
                  class="form-control"
                  placeholder="할 일을 여기에 입력!"
                  v-model.trim="todo"
                  @keyup.enter="addTodo"
                />
                <span class="btn btn-primary input-group-addon" @click="addTodo"
                  >추가</span
                >
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col">
              <!-- 할 일 목록 -->
              <ul class="list-group">
                <li
                  v-for="task in todolist"
                  :key="task.id"
                  class="list-group-item"
                  :class="{'list-group-item-success': task.completed}"
                  @click="toggleCompleted(task.id)"
                >
                  <span class="pointer" :class="{ 'todo-done': task.completed }"
                    >{{task.todo}} {{task.completed ? "(완료)" : ""}}</span
                  >
                  <span
                    class="float-end badge bg-secondary pointer"
                    @click="deleteTodo(task.id)"
                    >삭제</span
                  >
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="text/javascript" src="https://unpkg.com/vue"></script>
    <script type="text/javascript">
      var ts = new Date().getTime();
      var vm = Vue.createApp({
        name: 'App',
        data() {
          return {
            todo: '',
            todolist: [
              { id: ts, todo: '할 일1', completed: false },
              { id: ts + 1, todo: '할 일2', completed: true },
              { id: ts + 2, todo: '할 일3', completed: false },
            ],
          };
        },
        methods: {
          addTodo() {
            if (this.todo.length >= 2) {
              this.todolist.push({
                id: new Date().getTime(),
                todo: this.todo,
                completed: false,
              });
              this.todo = '';
              this.todolist.sort(
                (a, b) =>
                  a.completed - b.completed || a.todo.localeCompare(b.todo)
              );
            }
          },
          deleteTodo(id) {
            let index = this.todolist.findIndex((item) => id === item.id);
            this.todolist.splice(index, 1);
          },
          toggleCompleted(id) {
            let index = this.todolist.findIndex((item) => id === item.id);
            this.todolist[index].completed = !this.todolist[index].completed;
            this.todolist.sort(
              (a, b) =>
                a.completed - b.completed || a.todo.localeCompare(b.todo)
            );
          },
        },
      }).mount('#app');
    </script>
  </body>
</html>
