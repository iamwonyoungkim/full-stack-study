<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <h1>이미지를 선택해주세요~</h1>
      <select v-model="imageUrl">
        <option value="">---이미지 선택</option>
        <option value="https://picsum.photos/300/300">이미지1</option>
        <option value="https://picsum.photos/300/200">이미지2</option>
      </select>
      <br />
      <img v-bind:src="imageUrl" alt="" />
      <p>선택된 이미지 URL: {{imageUrl}}</p>
    </div>

    <script type="text/javascript" src="https://unpkg.com/vue"></script>
    <script>
      let vm = Vue.createApp({
        name: 'App',
        data() {
          return {
            imageUrl: '',
          };
        },
      }).mount('#app');
    </script>
  </body>
</html>
