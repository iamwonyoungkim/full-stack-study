<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .track-area {
        width: 70%;
        height: 300px;
        background-color: aqua;
        padding: 20px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div @mousemove="updateMousePosition" class="track-area">
        <p>이 영역 안에서 마우스를 움직여보세요</p>
        <p>마우스 위치 - X: {{x}}, Y: {{y}}</p>
      </div>
    </div>

    <script type="text/javascript" src="https://unpkg.com/vue"></script>
    <script>
      let vm = Vue.createApp({
        name: 'App',
        data() {
          return {
            x: 0,
            y: 0,
          };
        },
        methods: {
          updateMousePosition(e) {
            this.x = e.clientX;
            this.y = e.clientY;
          },
        },
      }).mount('#app');
    </script>
  </body>
</html>
