<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- fontawesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- bootstrap - css -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- 나의 css 파일 -->

    <!-- bootstrap - javascript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 나의 js 파일 -->
  </head>
  <body>
    <div id="app" class="container">
      <h1>도서 추가</h1>
      <form class="border p-3">
        <label for="title" class="mt-1 mb-1">도서명</label>
        <input type="text" v-model="addTitle" class="form-control" id="title" />
        <label for="author" class="mt-1 mb-1">저자</label>
        <input
          type="text"
          v-model="addAuthor"
          class="form-control"
          id="author"
        />
        <label for="isbn" class="mt-1 mb-1">ISBN</label>
        <input type="text" v-model="addIsbn" class="form-control" id="isbn" />
        <button @click="addBook" class="btn btn-primary mt-3">도서 추가</button>
      </form>
      <div class="clearfix">
        <h1 class="float-start">추가된 도서 목록</h1>
        <span class="badge bg-primary float-end m-3">총 도서 수: {{num}}</span>
      </div>
      <table class="table">
        <thead>
          <th>도서명</th>
          <th>저자</th>
          <th>ISBN</th>
          <th>작업</th>
        </thead>
        <tbody>
          <tr v-for="(book, index) in books" :key="index">
            <td>{{book.title}}</td>
            <td>{{book.author}}</td>
            <td>{{book.isbn}}</td>
            <td v-if="books.length > 0">
              <button @click="removeBook(index)" class="btn btn-danger">
                삭제
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script type="text/javascript" src="https://unpkg.com/vue"></script>
    <script>
      let vm = Vue.createApp({
        name: 'App',
        data() {
          return {
            num: 0,
            addTitle: '',
            addAuthor: '',
            addIsbn: '',
            books: [],
          };
        },
        methods: {
          addBook(event) {
            event.preventDefault();

            if (!this.addTitle || !this.addAuthor || !this.addIsbn) {
              alert('모든 필드를 입력해주세요!');
              return;
            }

            this.books.push({
              title: this.addTitle,
              author: this.addAuthor,
              isbn: this.addIsbn,
            });

            // 입력 필드 초기화
            this.addTitle = '';
            this.addAuthor = '';
            this.addIsbn = '';

            // 총 도서 수 업데이트
            this.num = this.books.length;
          },
          removeBook(index) {
            this.books.splice(index, 1);
            this.num = this.books.length;
          },
        },
      }).mount('#app');
    </script>
  </body>
</html>
