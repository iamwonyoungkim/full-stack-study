<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 200px;
        height: 200px;
        margin: 20px;
      }
      .highlight {
        background-color: #42b983;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="box" :class="info">
        <p>점수가 60점 이상이면 스타일이 적용됩니다.</p>
      </div>
      <div>
        <p>현재 점수: {{score}}점</p>
        <input type="number" v-model="score" />
      </div>
    </div>

    <script type="text/javascript" src="https://unpkg.com/vue"></script>
    <script>
      let vm = Vue.createApp({
        name: 'App',
        data() {
          return {
            score: 30,
          };
        },
        computed: {
          info() {
            return {
              highlight: this.score >= 60,
            };
          },
        },
      }).mount('#app');
    </script>
  </body>
</html>
